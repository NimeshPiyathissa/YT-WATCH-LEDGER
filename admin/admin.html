<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watch Tracker — Device information</title>
  <script src="../lib/theme-init.js"></script>
  <link rel="preload" href="../lib/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../lib/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="../lib/shell.css" />
  <link rel="stylesheet" href="../lib/readonly.css" />
</head>
<body>
  <header class="appbar"><div class="appbar-in">
    <span class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Watch Tracker</span>
    <nav class="appnav" aria-label="Pages">
      <a href="../dashboard/dashboard.html"><span data-icon="layout-dashboard"></span><span class="label">Dashboard</span></a>
      <a href="../settings/settings.html"><span data-icon="settings"></span><span class="label">Settings</span></a>
      <a href="admin.html" aria-current="page"><span data-icon="laptop"></span><span class="label">Device</span></a>
    </nav>
  </div></header>

  <main class="page">
    <div class="page-head">
      <div><h1>Device information</h1><p class="lede">What this browser reports about itself. Read-only: administration is done in the web dashboard, and tracking is paused from the toolbar popup.</p></div>
      <span id="livePill" class="pill off"><span class="dot"></span><span>Checking</span></span>
    </div>
    <div id="view" class="ro-grid" aria-live="polite"><span class="skel h-block"></span><span class="skel h-block"></span><span class="skel h-block"></span></div>

    <section class="card">
      <div class="card-head"><h3>Diagnostics <span class="sub">most recent 80 events, newest last</span></h3>
        <div class="ro-actions"><button class="btn btn-sm" id="copyDiag" type="button"><span data-icon="copy"></span>Copy log</button></div></div>
      <div id="diagLog" class="log ro-diag" role="log" aria-label="Diagnostics log"></div>
    </section>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>

  <script src="../lib/icons.js"></script>
  <script src="../lib/util.js"></script>
  <script src="../lib/db.js"></script>
  <script src="../lib/diag.js"></script>
  <script src="../lib/status.js"></script>
  <script src="admin.js"></script>
</body>
</html>
