<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watch Tracker — Dashboard</title>
  <script src="../lib/theme-init.js"></script>
  <link rel="preload" href="../lib/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../lib/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="../lib/shell.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header class="appbar"><div class="appbar-in">
    <span class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Watch Tracker</span>
    <nav class="appnav" aria-label="Pages">
      <a href="dashboard.html" aria-current="page"><span data-icon="layout-dashboard"></span><span class="label">Dashboard</span></a>
      <a href="../settings/settings.html"><span data-icon="settings"></span><span class="label">Settings</span></a>
      <a href="../admin/admin.html"><span data-icon="sliders-horizontal"></span><span class="label">Admin</span></a>
    </nav>
  </div></header>
  <main class="page">
    <div class="page-head"><div><h1>Dashboard</h1><p class="lede">YouTube watch time recorded on this device.</p></div></div>
    <section class="statbar" aria-label="Totals">
      <div class="stat lead"><div class="k">Today</div><div class="v num" id="tToday">—</div></div>
      <div class="stat"><div class="k">Last 7 days</div><div class="v num" id="tWeek">—</div></div>
      <div class="stat"><div class="k">All time</div><div class="v num" id="tAll">—</div></div>
      <div class="stat"><div class="k">Videos</div><div class="v num" id="tVideos">—</div></div>
    </section>
    <div class="split">
      <section class="card"><div class="card-head"><h3>Last 14 days</h3></div><div id="chart"><span class="skel h-block"></span></div></section>
      <section class="card"><div class="card-head"><h3>Top channels</h3></div><div id="channels"><span class="skel h-block"></span></div></section>
    </div>
    <section class="card flush">
      <div class="card-head"><h3>History <span class="sub num" id="histCount"></span></h3>
        <div class="searchbox"><span data-icon="search"></span><input class="input" id="search" type="search" placeholder="Search title or channel" aria-label="Search title or channel" /></div></div>
      <table class="table rtable" id="histTable"><thead><tr><th>Video</th><th>Channel</th><th class="right">Watched</th><th class="right">Last watched</th></tr></thead><tbody id="rows"></tbody></table>
      <div id="histEmpty" class="empty" hidden></div>
    </section>
  </main>
  <script src="../lib/icons.js"></script>
  <script src="../lib/util.js"></script>
  <script src="../lib/accounting.js"></script>
  <script src="../lib/db.js"></script>
  <script src="../lib/stats.js"></script>
  <script src="../lib/charts.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
