<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watch Tracker</title>
  <script src="../lib/theme-init.js"></script>
  <link rel="preload" href="../lib/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../lib/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <span class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Watch Tracker</span>
    <span id="state" class="pill off"><span class="dot"></span><span>Checking</span></span>
  </header>

  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
  <div id="remote" class="banner wait" role="status" hidden></div>
  <div id="error" class="alert bad" role="alert" hidden></div>

  <!-- connection card: filled in by popup.js for each state (not connected / pending / connected) -->
  <section id="conn" class="card conn" aria-label="Connection"></section>

  <section class="card pause" aria-label="Tracking">
    <div class="what"><b>Track watch time</b><span id="trackHint">Recording YouTube watch time on this device.</span></div>
    <label class="switch"><input type="checkbox" id="trackToggle" aria-label="Track watch time"><span class="slider"></span></label>
  </section>

  <section class="card tiles" aria-label="Watch time">
    <div class="stat"><div class="k">Today</div><div class="v num" id="today">—</div></div>
    <div class="stat"><div class="k">Last 7 days</div><div class="v num" id="week">—</div></div>
  </section>
  <p class="caption note" id="localNote"><span class="icon-slot" data-icon="shield-check"></span><span>Tracking YouTube watch time on this device only.</span></p>

  <nav class="actions" aria-label="Open">
    <button class="btn btn-accent btn-block" id="openDash" type="button"><span data-icon="layout-dashboard"></span>Open dashboard</button>
    <div class="pair">
      <button class="btn" id="openSettings" type="button"><span data-icon="settings"></span>Settings</button>
      <button class="btn" id="openAdmin" type="button"><span data-icon="laptop"></span>Device info</button>
    </div>
  </nav>
  <footer class="foot"><span id="version" class="caption num"></span></footer>

  <script src="../lib/icons.js"></script>
  <script src="../lib/build-config.js"></script>
  <script src="../lib/util.js"></script>
  <script src="../lib/accounting.js"></script>
  <script src="../lib/db.js"></script>
  <script src="../lib/stats.js"></script>
  <script src="../lib/sync.js"></script>
  <script src="../lib/status.js"></script>
  <script src="popup.js"></script>
</body>
</html>
